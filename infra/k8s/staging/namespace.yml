apiVersion: v1
kind: Namespace
metadata:
  name: cicd-demo-staging
  labels:
    name: cicd-demo-staging
    environment: staging
    project: cicd-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cicd-demo-config
  namespace: cicd-demo-staging
data:
  ENVIRONMENT: "staging"
  LOG_LEVEL: "debug"
  SERVICE_A_PORT: "3000"
  SERVICE_B_PORT: "3001"
---
apiVersion: v1
kind: Secret
metadata:
  name: cicd-demo-secrets
  namespace: cicd-demo-staging
type: Opaque
stringData:
  # These should be populated from external secret manager
  DB_PASSWORD: "placeholder"
  API_KEY: "placeholder"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cicd-demo-ingress
  namespace: cicd-demo-staging
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: staging.cicd-demo.example.com
      http:
        paths:
          - path: /service-a
            pathType: Prefix
            backend:
              service:
                name: service-a
                port:
                  number: 3000
          - path: /service-b
            pathType: Prefix
            backend:
              service:
                name: service-b
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-a
                port:
                  number: 3000